# Toolchain and tasks for a shared laenen-ai module.
#
# This file is the single source of tool versions. CI installs mise and runs
# `mise run check`; it does not pin gofumpt, golangci-lint or sqlc a second
# time in workflow YAML.

[tools]
go            = "1.27.3"
golangci-lint = "2.15.0"
sqlc          = "1.30.0"
gofumpt       = "0.12.0"

[env]
CGO_ENABLED = "0"

[tasks.fmt]
run = "gofumpt -l -w $(find . -path ./.claude -prune -o -name '*.go' -print)"

[tasks.fmt-check]
run = "test -z \"$(gofumpt -l $(find . -path ./.claude -prune -o -name '*.go' -print))\""

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
description = "Inner loop: no containers, no databases. Skips at run time, never behind a build tag."
# -count=1 disables the test cache, deliberately. A cached PASS is how a
# module-path rename once slipped through: the constants it moved were only
# asserted by tests whose inputs the cache considered unchanged, so nothing
# re-ran. The inner loop is fast enough that the cache buys nothing worth
# that.
run = "go test ./... -short -count=1 && (cd integration && go test ./... -short -count=1) && (cd internal/pg/integration && go test ./... -short -count=1) && (cd credentials/openbao/integration && go test ./... -short -count=1) && (cd testdb && go test ./... -short -count=1)"

[tasks.build]
description = "Proves the shipped binary is cgo-free: inherits CGO_ENABLED=0 from [env]."
run = "go build ./..."

[tasks.test-all]
description = "Full suite including container- and database-backed tests, with race detection and coverage."
# CGO_ENABLED=0 is a *release* constraint (cgo-free, cross-compilable binary),
# not a test constraint. The race detector needs cgo, and race detection is
# worth more in tests than cgo-freedom is; the cgo-free property is verified by
# the `build` task, which `check` also depends on.
env = { CGO_ENABLED = "1" }
# -count=1 for the same reason as the `test` task above. Coverage is collected
# across packages so a test that only touches an internal package still counts.
run = "go test ./... -race -coverpkg=github.com/laenenai/tenancy,github.com/laenenai/tenancy/credentials/openbao,github.com/laenenai/tenancy/tenancytest,github.com/laenenai/tenancy/internal/... -coverprofile=coverage-root.out -count=1 && (cd integration && go test ./... -race -coverpkg=github.com/laenenai/tenancy/... -coverprofile=../coverage-integration.out -count=1) && (cd internal/pg/integration && go test ./... -race -coverpkg=github.com/laenenai/tenancy/... -coverprofile=../../../coverage-pg.out -count=1) && (cd credentials/openbao/integration && go test ./... -race -coverpkg=github.com/laenenai/tenancy/... -coverprofile=../../../coverage-openbao.out -count=1) && (cd testdb && go test ./... -race -count=1) && python3 scripts/merge-coverage.py coverage-root.out coverage-integration.out coverage-pg.out coverage-openbao.out > coverage.out && go tool cover -func=coverage.out | tail -1"

[tasks.generate]
description = "Regenerate sqlc query code from db/queries against db/migrations."
run = "sqlc generate"

[tasks.generate-check]
description = "Fail if generated sqlc code or the query/schema inputs are stale."
run = "sqlc diff"

[tasks.vuln]
description = "Report reachable Go vulnerabilities."
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.api-diff]
description = "Compare the importable API with the last root tag using apidiff."
run = "bash scripts/api-diff.sh"

[tasks.release-check]
description = "Validate a clean release tree with gorelease (run from a clean checkout)."
run = "go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base=latest"

[tasks.check]
depends = ["fmt-check", "lint", "build", "test-all", "generate-check", "vuln", "api-diff"]
