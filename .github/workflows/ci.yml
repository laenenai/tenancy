name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit; Renovate updates the comment and SHA together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # api-diff needs tags to find the previous release.
          fetch-depth: 0

      # mise.toml is the single source of tool versions. This installs Go,
      # sqlc, gofumpt and golangci-lint, then runs the same gate a developer
      # runs locally. govulncheck is run at a pinned version by the task.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: check
        # api-diff reports pre-1.0 breaking changes but does not fail on them.
        # Set API_DIFF_STRICT=1 here after 1.0.
        run: mise run check

      - name: coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          else
            echo "coverage.out was not produced"
          fi

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
