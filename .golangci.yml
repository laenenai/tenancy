version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - errorlint
    - noctx
    - gocritic
    - forbidigo
    - depguard
  settings:
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: "use structured logging instead of fmt.Print*"
        - pattern: '^panic$'
          msg: "panic is forbidden outside main; return a typed error instead"
    depguard:
      rules:
        # The previous obs/otel rule was stale: this module has no internal/obs
        # and no OTel metric dependency. Keep depguard enabled for the next
        # real boundary rather than documenting a package that does not exist.
        module-boundaries:
          list-mode: lax
          files:
            - "**/internal/domain/**"
            - "**/internal/pg/**"
            - "**/internal/pool/**"
            - "**/internal/registry/**"
          deny:
            - pkg: github.com/laenenai/tenancy/internal/scope
              desc: "internal/scope is the composition layer; these packages must not import it"
  exclusions:
    rules:
      # panic is allowed only in the main package itself: files directly
      # inside cmd/<binary>/ (not any subpackage nested under it). fmt.Print*
      # stays forbidden everywhere, including main, so this rule is scoped to
      # the panic-specific forbidigo message only.
      - path: '^cmd/[^/]+/[^/]+\.go$'
        linters:
          - forbidigo
        text: '`panic` forbidden'
